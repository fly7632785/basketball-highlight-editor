<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BHE 移动端页面设计稿</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 32px; background: #0b0e14; color: #e6e8ee; font: 14px Inter, -apple-system, BlinkMacSystemFont, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    p { color: #9aa0ac; margin: 0 0 28px; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1400px; }
    figure { margin: 0; padding: 12px; background: #121620; border: 1px solid #31343f; border-radius: 10px; }
    img { display: block; width: 100%; height: auto; background: #0b0e14; border-radius: 6px; }
    figcaption { padding: 12px 4px 2px; font-weight: 600; }
    small { color: #6b7280; font-weight: 400; }
  </style>
</head>
<body>
  <h1>BHE 移动端页面设计稿</h1>
  <p>基于桌面端功能和视觉语言的移动端适配方案。当前为视觉预览，不代表已修改 Flutter 页面。</p>
  <main>
    <figure><img src="rendered/bhe-mobile-project-home.svg.png" alt="项目首页"><figcaption>01 · 项目首页 <small>新建、打开、统计、最近项目</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-import-video.svg.png" alt="导入视频"><figcaption>02 · 导入视频 <small>视频预检、大小、耗时提示</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-analysis-config.svg.png" alt="分析配置"><figcaption>03 · 分析配置 <small>范围、ROI、片段时长、质量</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-analysis-progress.svg.png" alt="分析进度"><figcaption>04 · 分析进度 <small>阶段、进度、耗时、帧数</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-review-workbench.svg.png" alt="审核工作台"><figcaption>05 · 审核工作台 <small>视频优先、连续审核</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-export.svg.png" alt="导出集锦"><figcaption>06 · 导出集锦 <small>筛选、合并/分片、历史</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-import-video-v2.svg.png" alt="导入视频 v2"><figcaption>02b · 导入 v2 <small>相册/文件/拍摄三入口、耗时预期、隐私声明</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-analysis-config-v2.svg.png" alt="分析配置 v2"><figcaption>03b · 配置 v2 <small>自动识别 ROI 优先、手动降级为高级选项</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-review-workbench-v2.svg.png" alt="审核工作台 v2"><figcaption>05b · 审核 v2 <small>全屏卡片流、上滑保留/下滑排除、双状态展示</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-export-v2.svg.png" alt="导出集锦 v2"><figcaption>06b · 导出 v2 <small>保存相册/系统分享主按钮、历史再次分享</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-settings.svg.png" alt="设置与反馈"><figcaption>07 · 设置与反馈 <small>主题、偏好、反馈、关于</small></figcaption></figure>
    <figure><img src="rendered/bhe-mobile-empty-recovery.svg.png" alt="空状态与恢复"><figcaption>08 · 空状态/恢复 <small>没有候选时的下一步</small></figcaption></figure>
  </main>
</body>
</html>
