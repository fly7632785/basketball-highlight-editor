<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1160" viewBox="0 0 860 1160">
  <rect width="860" height="1160" fill="#0b0e14"/>
  <text x="40" y="52" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">BHE · 移动端分析配置 v2</text>
  <text x="40" y="82" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="13">自动识别优先 · 手动框选降级为高级选项</text>

  <rect x="215" y="118" width="430" height="932" rx="28" fill="#121620" stroke="#31343f" stroke-width="2"/>
  <rect x="228" y="131" width="404" height="906" rx="20" fill="#0b0e14"/>

  <rect x="228" y="131" width="404" height="60" rx="20" fill="#121620"/>
  <path d="M252 156l10-10m-10 10l10 10" fill="none" stroke="#e6e8ee" stroke-width="2" stroke-linecap="round"/>
  <text x="280" y="161" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">确认配置</text>
  <text x="280" y="180" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="11">第 2 步 / 共 3 步 · 建议直接开始</text>
  <circle cx="556" cy="161" r="5" fill="#3fb950"/>
  <circle cx="576" cy="161" r="5" fill="#ff6b2c"/>
  <circle cx="596" cy="161" r="5" fill="#31343f"/>

  <!-- auto ROI result -->
  <rect x="252" y="211" width="356" height="190" rx="12" fill="#121620" stroke="#3fb950" stroke-opacity=".45"/>
  <rect x="268" y="227" width="150" height="158" rx="8" fill="#1d292a"/>
  <path d="M268 330l150-36v91H268z" fill="#263537"/>
  <rect x="316" y="262" width="40" height="4" fill="#f0f1eb"/>
  <ellipse cx="336" cy="284" rx="15" ry="4" fill="none" stroke="#f08c46" stroke-width="2.5"/>
  <path d="M325 286l3 22 5-21 4 22 4-20 4 19" fill="none" stroke="#d9e0d9" stroke-width="1.2"/>
  <rect x="302" y="252" width="68" height="76" fill="none" stroke="#ff6b2c" stroke-width="2"/>
  <rect x="316" y="290" width="40" height="38" fill="none" stroke="#e6e8ee" stroke-width="1.5" stroke-dasharray="3 2"/>
  <path d="M456 258l14 14m0-14l-14 14" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <text x="436" y="256" fill="#3fb950" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">篮筐与篮网</text>
  <text x="436" y="274" fill="#3fb950" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">识别成功</text>
  <text x="436" y="298" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="11">置信度 91% · 采样 12 帧</text>
  <text x="436" y="316" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="11">橙色 = 投篮分析区</text>
  <text x="436" y="334" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="11">白色 = 篮网检测区</text>
  <rect x="436" y="348" width="120" height="26" rx="6" fill="#1a1f2b" stroke="#31343f"/>
  <text x="496" y="365" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">改用手动框选</text>

  <!-- clip length -->
  <text x="252" y="436" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">片段时长</text>
  <rect x="252" y="450" width="356" height="60" rx="12" fill="#121620" stroke="#31343f"/>
  <text x="276" y="486" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="12">进球前</text>
  <rect x="322" y="466" width="32" height="28" rx="6" fill="#1a1f2b" stroke="#31343f"/>
  <text x="338" y="485" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">−</text>
  <text x="372" y="487" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">6 秒</text>
  <rect x="404" y="466" width="32" height="28" rx="6" fill="#1a1f2b" stroke="#31343f"/>
  <text x="420" y="485" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">+</text>
  <text x="500" y="486" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="12">进球后</text>
  <rect x="540" y="466" width="32" height="28" rx="6" fill="#1a1f2b" stroke="#31343f"/>
  <text x="556" y="485" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">−</text>
  <text x="480" y="487" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">3 秒</text>
  <rect x="508" y="466" width="32" height="28" rx="6" fill="#1a1f2b" stroke="#31343f"/>
  <text x="524" y="485" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">+</text>

  <!-- quality -->
  <text x="252" y="544" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">分析质量</text>
  <rect x="252" y="558" width="356" height="48" rx="12" fill="#121620" stroke="#31343f"/>
  <rect x="260" y="566" width="168" height="32" rx="8" fill="#1a1f2b"/>
  <text x="344" y="587" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">快速 · 约2分钟</text>
  <rect x="432" y="566" width="168" height="32" rx="8" fill="#ff6b2c"/>
  <text x="516" y="587" fill="#1a0d05" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">标准 · 约4分钟</text>

  <!-- advanced (collapsed) -->
  <rect x="252" y="626" width="356" height="52" rx="12" fill="#121620" stroke="#31343f"/>
  <path d="M276 652h9m-4.5-4.5v9" stroke="#9aa0ac" stroke-width="1.8" stroke-linecap="round"/>
  <text x="300" y="657" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="13">高级选项 · 分析范围 / 手动 ROI / 阈值</text>
  <path d="M580 646l6 6 6-6" fill="none" stroke="#9aa0ac" stroke-width="1.5"/>

  <!-- summary -->
  <rect x="252" y="700" width="356" height="64" rx="12" fill="#1a1f2b" stroke="#31343f"/>
  <text x="276" y="726" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="11">本次分析</text>
  <text x="276" y="748" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13">28 分钟全片 · 标准质量 · 预计 4 分钟 · 约 50 个候选</text>

  <!-- CTA -->
  <rect x="252" y="930" width="356" height="56" rx="10" fill="#ff6b2c"/>
  <text x="430" y="964" fill="#1a0d05" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">开始分析</text>

  <text x="40" y="1108" fill="#e6e8ee" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">优化点</text>
  <text x="40" y="1132" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="12">1 原稿需手动框 ROI/篮网两框（手机上高摩擦）；v2 自动识别，一眼确认即可开始</text>
  <text x="40" y="1154" fill="#9aa0ac" font-family="Inter, Arial, sans-serif" font-size="12">2 手动框选降级到高级选项  3 质量档位带耗时预期  4 片段时长用 stepper 替代输入</text>
</svg>
