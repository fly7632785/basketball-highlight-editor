name: Bug report
description: Report a reproducible problem in the app or analysis workflow.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not upload real game footage, personal data, secrets, or private paths.
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 / Windows / Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App or commit version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest reproducible flow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove personal paths, tokens, and private media references before posting.
      render: shell
