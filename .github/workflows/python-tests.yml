name: Python tests

on:
  push:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  open-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_open_source.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
