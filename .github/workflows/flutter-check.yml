name: Flutter checks

on:
  push:
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/flutter-check.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/flutter-check.yml"

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
      - run: flutter pub get
        working-directory: apps/desktop
      - run: flutter analyze
        working-directory: apps/desktop
      - name: flutter test
        working-directory: apps/desktop
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            grep -E ' -[1-9][0-9]*:|Test failed|Expected:' "$RUNNER_TEMP/flutter-test.log" \
              | tail -20 \
              | while IFS= read -r failure; do
                  echo "::error title=Flutter test failure::$failure"
                done
          fi
          exit "$test_status"
