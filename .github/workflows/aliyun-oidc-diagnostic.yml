name: Diagnose Alibaba Cloud OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    name: Verify GitHub OIDC claims and Alibaba role
    runs-on: ubuntu-latest
    steps:
      - name: Inspect OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.aliyuncs.com")"
          token="$(jq -r '.value' <<< "$token_response")"
          test -n "$token"
          payload="$(cut -d. -f2 <<< "$token" | tr '_-' '/+' | base64 -d 2>/dev/null || true)"
          jq '{iss, aud, sub, repository, repository_owner, ref, workflow, job_workflow_ref}' <<< "$payload"

      - name: Configure Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIYUN_RAM_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: bhe-oidc-diagnostic-${{ github.run_id }}
          role-session-expiration: 900
          audience: sts.aliyuncs.com
